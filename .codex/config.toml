#:schema https://developers.openai.com/codex/config-schema.json

# AIWork project-local Codex overlay for ECC.
# Global ECC assets live in /Users/lulu/.codex.

approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "live"

[features]
multi_agent = true

[mcp_servers.mempalace]
command = "python3"
args = ["-m", "mempalace.mcp_server"]
startup_timeout_sec = 20.0
tool_timeout_sec = 120.0

[mcp_servers.mempalace.env]
MEMPAL_DIR = "/Users/lulu/AIWork"

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"

[agents.assessment_supervisor]
description = "Assessment worker supervisor that dispatches Gemini prompts, checks outputs, and routes rework."
config_file = "agents/assessment-supervisor.toml"
