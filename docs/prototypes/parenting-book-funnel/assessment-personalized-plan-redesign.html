<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>7天AI亲子行动陪练 · 原型</title>
  <link rel="stylesheet" href="assessment-redesign.css">
</head>
<body>
  <div class="prototype-shell">
    <div class="phone">
      <div class="screen">
        <div class="statusbar">
          <span>9:41</span>
          <div class="statusbar__icons">
            <span>5G</span>
            <span class="statusbar__pill"></span>
          </div>
        </div>

        <header class="topbar topbar--center">
          <a class="topbar__back" href="assessment-results-redesign.html">返回</a>
          <h1 class="topbar__title">7天AI亲子行动陪练</h1>
        </header>

        <main class="page">
          <div class="stack">
            <section class="card plan-hero">
              <span class="eyebrow">7天行动陪练</span>
              <h2 class="plan-hero__title">把测评结果变成每天能做的一步</h2>
              <p class="plan-hero__text">
                这套陪练会把“急、吼、内疚”的循环拆成每天一个小动作，
                先从信念调整和情绪减压开始。
              </p>
            </section>

            <section class="card plan-summary plan-summary--tight">
              <p class="block-label">陪练能帮助什么</p>
              <p class="block-copy">
                帮你看见触发点，练习一句新的自我提醒，把一次冲突复盘成下一步动作。
                每天只完成一个小任务，先把家长自己的节奏稳下来。
              </p>
            </section>

            <section class="card plan-list-card">
              <h3 class="plan-list-card__title">陪练具体内容</h3>
              <div class="plan-chip-list">
                <div class="plan-chip-row">
                  <p class="plan-chip-row__day">Day 1</p>
                  <p class="plan-chip-row__text">看见一次急、吼、内疚背后的触发点</p>
                </div>
                <div class="plan-chip-row">
                  <p class="plan-chip-row__day">Day 2</p>
                  <p class="plan-chip-row__text">把“必须马上改好”换成“先稳住这一刻”</p>
                </div>
                <div class="plan-chip-row">
                  <p class="plan-chip-row__day">Day 3</p>
                  <p class="plan-chip-row__text">复盘一次冲突里真正想保护的东西</p>
                </div>
                <div class="plan-chip-row">
                  <p class="plan-chip-row__day">Day 4</p>
                  <p class="plan-chip-row__text">练一句不伤关系的提醒</p>
                </div>
              </div>
            </section>

            <section class="card cta-card">
              <a class="btn btn--primary" href="assessment-family-sheet-redesign.html">立即付费开通</a>
            </section>
          </div>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
